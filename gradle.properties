android.useAndroidX=true
org.gradle.jvmargs=-Xmx2048m -XX:+HeapDumpOnOutOfMemoryError
sdkVersion=1.0.53

# SPEC-070-A J.25 — library-friendly Gradle flags.
# nonTransitiveRClass: each module gets its own R, prevents bloat for hosts.
# enableJetifier=false: we only depend on AndroidX, so the support-lib rewrite
# tool can stay off and shave a few seconds off every build.
# kotlin.code.style=official: pin formatter to Kotlin official style guide.
android.nonTransitiveRClass=true
android.enableJetifier=false
kotlin.code.style=official

# AppDNA cross-platform feature-parity marker (SPEC-070-0).
# Android SDK 1.0.53 wraps iOS 1.0.81: a button could be SIZED or ALIGNED, never both
# (#654/#659/#663) — `element_width: "auto"` was ignored by every renderer, which hardcoded a
# full-width fill, so an auto-width button spanned the row and the author's horizontal_align had
# nothing left to move. Carries forward the authored button border (#609), the Multi-buttons group
# (#609) and the refresh-in-place button action (#657), plus the render fixes for the stray Skip
# (#653), horizontal_align on a width-constrained block (#654/#659), the bottom-zone scroll reserve
# (#655), summary cards surviving one unresolved token (#660) and the social-login divider's text
# colour (#615).
# Each SDK's own version is +1 on what its PUBLIC registry holds and moves
# independently (Android v1.0.52 → 1.0.53); only this parity marker tracks iOS. CI
# (`pnpm check:version-lockstep`) enforces parity equality with iOS s.version.
appdnaFeatureParity=1.0.81
