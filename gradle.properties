android.useAndroidX=true
org.gradle.jvmargs=-Xmx2048m -XX:+HeapDumpOnOutOfMemoryError
sdkVersion=1.0.56

# Library-friendly Gradle flags.
# nonTransitiveRClass: each module gets its own R, prevents bloat for hosts.
# enableJetifier=false: we only depend on AndroidX, so the support-lib rewrite
# tool can stay off and shave a few seconds off every build.
# kotlin.code.style=official: pin formatter to Kotlin official style guide.
android.nonTransitiveRClass=true
android.enableJetifier=false
kotlin.code.style=official

# AppDNA cross-platform feature-parity marker.
# Android SDK 1.0.56 wraps iOS 1.0.84: Play Billing Library 8 — Play refuses an app built on 7.
# Android SDK 1.0.55 wrapped iOS 1.0.83: host-reported paying users (reportPayingUser).
# A provider selector (Mapbox or Google) on every map block; Google's static grammar, styled-map
# JSON, Cloud map IDs, light/dark themes and retina; and a BUNDLED interactive tier, which is what
# hosts were really asking for — `map_interactive: true` on a Flutter or React Native host used to
# produce a still image, silently, because the only pannable path went through
# `AppDNA.registerMapView`, an API neither wrapper exposes. Plus fullscreen and top/bottom anchored
# placements, numeric-string coercion for the values the console actually publishes ("12", not 12),
# and the map crash fix itself: a full-bleed map applied negative padding, which Compose rejects,
# and it took the whole step down rather than the map.
# 🔴 The two platforms differ on ONE thing and it is not a bug: iOS takes its Google key at runtime
# (`GMSServices.provideAPIKey`), so a Flutter host needs no wiring at all; Android reads
# `com.google.android.geo.API_KEY` from the MERGED MANIFEST at build time, so a host that wants a
# pannable Google map must add one `<meta-data>` line. Without it the SDK falls back to the static
# tier rather than drawing the Maps SDK's grey "no key" rectangle.
# Each SDK's own version is +1 on what its PUBLIC registry holds and moves
# independently (Android v1.0.54 → 1.0.55); only this parity marker tracks iOS. CI
# (`pnpm check:version-lockstep`) enforces parity equality with iOS s.version.
appdnaFeatureParity=1.0.84
